<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' qrc:; style-src 'self' 'unsafe-inline'; font-src 'self';">
  <title>Bicdop</title>
  <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="terminal.css">
  <script defer src="node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script defer src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script defer src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script defer src="bridge.js"></script>
  <script defer src="renderer.js"></script>
</head>
<body>
  <header class="toolbar">
    <div class="brand" aria-label="Bicdop">Bicdop</div>
    <div id="tabs" role="tablist" aria-label="Terminal sessions"></div>
    <div class="actions">
      <button id="new" class="new-tab" title="New terminal (Alt+Shift+T)" aria-label="New terminal" disabled>+</button>
      <select id="profile" aria-label="Default shell for new tabs" title="Default shell for new tabs" disabled></select>
    </div>
  </header>
  <main id="terminal">
    <div id="empty">
      <p id="empty-message">Starting terminal…</p>
    </div>
  </main>
  <footer>
    <span id="status" role="status">Starting</span>
    <span id="dimensions"></span>
  </footer>
</body>
</html>
